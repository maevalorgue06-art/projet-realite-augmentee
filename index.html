<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        #ui {
            position: fixed; bottom: 20px; left: 0; right: 0;
            text-align: center; color: #fff; font-family: sans-serif;
            z-index: 10; pointer-events: none; display: none;
        }
        #nom { font-size: 22px; font-weight: bold; text-shadow: 0 1px 4px #000; }
        #hint { font-size: 14px; opacity: 0.8; text-shadow: 0 1px 4px #000; }
        #dots span {
            display: inline-block; width: 10px; height: 10px; border-radius: 50%;
            background: rgba(255,255,255,0.4); margin: 8px 4px;
        }
        #dots span.actif { background: #fff; }
    </style>

    <script>
        // Liste des boissons : nom affiché + id de l'image dans <a-assets>
        const boissons = [
            { nom: "Matcha", img: "#info-matcha" },
            { nom: "Gingembre citron", img: "#info-gingembre" },
            { nom: "Hibiscus", img: "#info-hibiscus" }
        ];
        let index = 0;

        function afficher(i) {
            index = (i + boissons.length) % boissons.length;
            document.querySelector("#carte").setAttribute("src", boissons[index].img);
            document.querySelector("#nom").textContent = boissons[index].nom;
            document.querySelectorAll("#dots span").forEach((d, n) => {
                d.classList.toggle("actif", n === index);
            });
        }

        document.addEventListener("DOMContentLoaded", function () {
            // Création des points
            const dots = document.querySelector("#dots");
            boissons.forEach(() => dots.appendChild(document.createElement("span")));
            afficher(0);

            // Swipe gauche / droite
            let startX = 0;
            document.addEventListener("touchstart", e => {
                startX = e.touches[0].clientX;
            });
            document.addEventListener("touchend", e => {
                const dx = e.changedTouches[0].clientX - startX;
                if (Math.abs(dx) > 50) {
                    afficher(dx < 0 ? index + 1 : index - 1);
                }
            });

            // Flèches clavier (pour tester sur ordi)
            document.addEventListener("keydown", e => {
                if (e.key === "ArrowRight") afficher(index + 1);
                if (e.key === "ArrowLeft") afficher(index - 1);
            });

            // Overlay visible uniquement quand le gobelet est détecté
            const cible = document.querySelector("#gobelet");
            const ui = document.querySelector("#ui");
            cible.addEventListener("targetFound", () => ui.style.display = "block");
            cible.addEventListener("targetLost", () => ui.style.display = "none");
        });
    </script>
</head>

<body>
    <div id="ui">
        <div id="nom"></div>
        <div id="dots"></div>
        <div id="hint">← glisse pour changer de boisson →</div>
    </div>

    <a-scene
        mindar-image="imageTargetSrc: images/logo.mind;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <img id="info-matcha" src="images/info-matcha.png" />
            <img id="info-gingembre" src="images/info-gingembre.png" />
            <img id="info-hibiscus" src="images/info-hibiscus.png" />
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="gobelet">
            <a-image id="carte" src="#info-matcha"
                position="0 0 0.05" width="1" height="1.4"
                animation="property: position; to: 0 0.05 0.05; dir: alternate; dur: 1500; loop: true; easing: easeInOutSine">
            </a-image>
        </a-entity>
    </a-scene>
</body>
</html>
